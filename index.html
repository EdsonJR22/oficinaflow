<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OficinaFlow</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <h1>Oficina<span class="flow">Flow</span></h1>
            <p>Sua oficina mais eficiente</p>
        </div>
        <nav class="menu">
            <a href="#" class="ativo">Dashboard</a>
            <a href="#">Clientes</a>
            <a href="#">Veículos</a>
            <a href="#">Orçamentos</a>
            <a href="#">Ordens de Serviço</a>
        </nav>
        <div class="sidebar-footer">
            <a href="#">Configurações</a>
        </div>
    </aside>
    <main class="conteudo">
        <header class="header">
            <div class="header-conteudo">
                <h1>Bom dia, Oficina Machado</h1>
                <p>Aqui está um resumo da sua oficina hoje.</p>
            </div>
            <div class="perfil">
                <span>EM</span>
            </div>
        </header>
        <section class="secao-cards">
            <div class="card">
                <h2>5</h2>
                <p>Veículos na oficina</p>
            </div>
            <div class="card">
                <h2>3</h2>
                <p>Aguardando aprovação</p>
            </div>
            <div class="card">
                <h2>2</h2>
                <p>Serviços em andamento</p>
            </div>
            <div class="card">
                <h2>R$ 4.280</h2>
                <p>Faturado no mês</p>
            </div>
        </section>
    </main>
</body>
</html>
